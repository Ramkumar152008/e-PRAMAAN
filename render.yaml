# ==============================================================================
# Render.com Blueprint Infrastructure as Code
# e-BID PRAMAAN — CPCL
# AI-Powered Integrated Bid Compliance Verification Platform for GeM Procurement
# ==============================================================================

services:
  # ─── 1. FASTAPI BACKEND WEB SERVICE ──────────────────────────────────────────
  - type: web
    name: ebid-pramaan-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  # ─── 2. VITE + REACT FRONTEND STATIC SITE ────────────────────────────────────
  - type: static
    name: ebid-pramaan-frontend
    region: oregon
    plan: free
    rootDir: sih 26
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # SPA fallback routing - prevents 404 on page refresh
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BASE_PATH
        value: "/"
      - key: VITE_API_HOST
        fromService:
          type: web
          name: ebid-pramaan-backend
          property: host
